<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings — Accord Archive & Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { accord: { blue: '#0077FF', darkBlue: '#005BC4', lightBlue: '#E6F0FF', gold: '#F5A623', slate: '#0F172A', muted: '#64748B', bg: '#F8FAFC' } },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-accord-bg text-accord-slate antialiased min-h-screen flex flex-col justify-between">
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-accord-slate text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
        <i class="fa-solid fa-circle-check text-accord-gold text-lg"></i>
        <span id="toast-message" class="font-medium text-sm">Action completed.</span>
    </div>

    <!-- Header / Navigation (Unified Accord Header) -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <!-- Brand Logo -->
            <a href="index.html" class="flex items-center space-x-3 group">
                <div class="w-11 h-11 bg-accord-blue rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform">
                    <span class="font-bold text-xl tracking-tighter">Ac</span>
                </div>
                <div>
                    <div class="flex items-center">
                        <span class="text-2xl font-extrabold tracking-tight text-accord-slate">Acco</span>
                        <span class="text-2xl font-extrabold tracking-tight text-accord-slate logo-rd-bar">rd</span>
                    </div>
                    <p class="text-[10px] uppercase tracking-widest font-bold text-accord-blue">Official Archive & Library</p>
                </div>
            </a>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center space-x-7">
                <a href="index.html" class="text-sm font-semibold text-accord-slate hover:text-accord-blue transition-colors">Digital Library</a>
                <a href="forum.html" class="text-sm font-semibold text-accord-slate hover:text-accord-blue transition-colors">Testimonies</a>
                <a href="music.html" class="text-sm font-semibold text-accord-slate hover:text-accord-blue transition-colors">Music</a>
                <a href="saved.html" class="relative text-sm font-semibold text-accord-slate hover:text-accord-blue transition-colors flex items-center space-x-1.5" title="Saved">
                    <i class="fa-solid fa-bookmark text-accord-gold"></i>
                    <span>Saved</span>
                    <span id="bookmark-badge" class="bg-accord-gold text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">0</span>
                </a>
            </nav>

            <!-- Sign In CTA & Mobile Toggle -->
            <div class="flex items-center space-x-2.5">
                <button id="auth-nav-btn" type="button" onclick="handleAuthNavClick()" class="hidden sm:inline-flex items-center space-x-2 bg-accord-blue hover:bg-accord-darkBlue text-white text-xs sm:text-sm font-semibold px-4 sm:px-5 py-2.5 rounded-xl shadow-lg shadow-blue-500/20 transition-all">
                    <i class="fa-regular fa-user"></i>
                    <span id="auth-nav-label">Sign In</span>
                </button>
                <button type="button" onclick="toggleMobileMenu()" class="md:hidden p-2 text-accord-slate hover:text-accord-blue" aria-label="Toggle Menu">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-200 px-6 py-4 space-y-3">
            <a href="index.html" onclick="toggleMobileMenu()" class="block text-base font-medium text-accord-slate">Digital Library</a>
            <a href="forum.html" onclick="toggleMobileMenu()" class="block text-base font-medium text-accord-slate">Testimonies</a>
            <a href="music.html" onclick="toggleMobileMenu()" class="block text-base font-medium text-accord-slate">Music</a>
            <a href="saved.html" onclick="toggleMobileMenu()" class="flex items-center justify-between text-base font-medium text-accord-slate pt-1">
                <span class="flex items-center space-x-2">
                    <i class="fa-solid fa-bookmark text-accord-gold"></i>
                    <span>Saved</span>
                </span>
                <span id="mobile-bookmark-count" class="bg-accord-gold text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
            </a>
            <button type="button" onclick="handleAuthNavClick(); toggleMobileMenu();" class="flex items-center space-x-2 text-base font-medium text-accord-blue pt-2 w-full text-left border-t border-slate-100">
                <i class="fa-regular fa-user"></i>
                <span id="mobile-auth-label">Sign In / Create Account</span>
            </button>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 sm:px-6 py-12 flex-grow w-full space-y-8">
        <div class="bg-white border border-slate-200/90 rounded-3xl p-8 shadow-sm space-y-6">
            <div>
                <h1 class="serif-heading text-2xl font-bold text-accord-slate">Profile Settings</h1>
                <p class="text-xs text-accord-muted mt-1">Manage your account credentials and personal details.</p>
            </div>

            <form onsubmit="handleProfileUpdate(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Full Name</label>
                    <input type="text" id="profile-name" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-accord-blue">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Email Address (Read-only)</label>
                    <input type="email" id="profile-email" disabled class="w-full bg-slate-100 border border-slate-200 rounded-xl px-4 py-3 text-sm text-accord-muted cursor-not-allowed">
                </div>
                <button type="submit" id="profile-save-btn" class="w-full bg-accord-blue hover:bg-accord-darkBlue text-white font-bold py-3.5 rounded-xl text-sm transition-all shadow-md">
                    Save Profile Changes
                </button>
            </form>

            <div class="pt-4 border-t border-slate-100">
                <button onclick="handleSignOut()" class="w-full border border-red-200 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-xl text-xs transition-all">
                    Sign Out of Account
                </button>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 text-center text-xs text-accord-muted">
        © 2026 Accord Media House. All rights reserved.
    </footer>
    <script src="profile.js"></script>
</body>
</html>
