<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accord Fellowship Feed — Videos, Testimonies, Audio & Text Posts</title>
    <link rel="icon" type="image/svg+xml" href="assets/accord-mark.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0077FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Accord" />
    <link rel="apple-touch-icon" href="/assets/icon-180.png" />
    <script src="/pwa-install.js" defer></script>
    <meta name="description" content="Watch sermons, listen to audio teachings, and read fellowship posts and testimonies on Accord." />

    <!-- Open Graph / WhatsApp / Social Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Accord Archive & Library" />
    <meta property="og:url" content="https://www.accordarchives.com/feed.html" />
    <meta property="og:title" content="Accord Fellowship Feed — Videos, Testimonies, Audio & Text Posts" />
    <meta property="og:description" content="Watch sermons, listen to audio teachings, and read fellowship posts and testimonies on Accord." />
    <meta property="og:image" content="https://www.accordarchives.com/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Accord Fellowship Feed" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Accord Fellowship Feed — Videos, Testimonies, Audio & Text Posts" />
    <meta name="twitter:description" content="Watch sermons, listen to audio teachings, and read fellowship posts and testimonies on Accord." />
    <meta name="twitter:image" content="https://www.accordarchives.com/og-cover.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accord: {
                            blue: '#0077FE',
                            darkBlue: '#005BC4',
                            lightBlue: '#E6F0FF',
                            gold: '#F5A623',
                            goldLight: '#FEF9E7',
                            slate: '#0F172A',
                            muted: '#64748B',
                            bg: '#F8FAFC'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif-heading { font-family: 'Playfair Display', serif; }
        .no-scrollbar::-webkit-scrollbar { height: 5px; }
        .no-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-[#F0F2F5] text-accord-slate antialiased min-h-screen flex flex-col justify-between selection:bg-accord-blue selection:text-white">

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-[200] pointer-events-none transform translate-y-24 opacity-0 transition-all duration-300 bg-accord-slate text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
        <i id="toast-icon" class="fa-solid fa-circle-check text-accord-gold text-lg"></i>
        <span id="toast-message" class="font-medium text-sm">Action completed successfully.</span>
    </div>

    <!-- Global Header Container -->
    <div id="accord-header"></div>
    <script src="header.js?v=4"></script>

    <!-- Report / Flag Down Modal -->
    <div id="report-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-accord-slate text-base">Flag / Report Post</h3>
                <button type="button" onclick="closeReportModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="report-form" onsubmit="handleReportSubmit(event)" class="space-y-4">
                <input type="hidden" id="report-post-id">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Reason</label>
                    <select id="report-category-reason" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs focus:outline-none focus:border-accord-blue">
                        <option value="Spam or Promotional">Spam or Promotional</option>
                        <option value="Off-Topic or Misleading">Off-Topic or Misleading</option>
                        <option value="Inappropriate Content">Inappropriate Content</option>
                        <option value="Harassment or Harm">Harassment or Harm</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Additional Details</label>
                    <textarea id="report-reason" rows="3" required placeholder="Explain why this post should be flagged for review..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-accord-blue"></textarea>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeReportModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-accord-slate text-xs font-bold">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold shadow-md">Flag Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Repost Modal -->
    <div id="repost-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-accord-slate text-base">Repost to Your Followers</h3>
                <button type="button" onclick="closeRepostModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="repost-form" onsubmit="handleRepostSubmit(event)" class="space-y-4">
                <input type="hidden" id="repost-post-id">
                <p id="repost-post-preview" class="text-xs font-semibold text-accord-slate bg-slate-50 border border-slate-200 rounded-xl p-3 line-clamp-2"></p>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Add a Thought (Optional)</label>
                    <textarea id="repost-quote-text" rows="2" placeholder="Share why this blessed you..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-accord-blue"></textarea>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeRepostModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-accord-slate text-xs font-bold">Cancel</button>
                    <button type="submit" id="repost-submit-btn" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-md inline-flex items-center space-x-1.5">
                        <i class="fa-solid fa-retweet"></i>
                        <span>Repost</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Create Post Modal (Testimonies open to all/anonymous; Video/Audio/Text for Ministries & Ministers) -->
    <div id="create-post-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
            <div class="px-6 py-5 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
                <div>
                    <h3 class="font-bold text-accord-slate text-base">Create a Feed Post</h3>
                    <p id="create-post-permission-note" class="text-xs text-accord-muted">Testimonies can be shared anonymously; Videos, Audio & Text Posts are for Ministries/Ministers.</p>
                </div>
                <button type="button" onclick="closeCreatePostModal()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="create-post-form" onsubmit="handleCreatePostSubmit(event)" class="p-6 space-y-4 overflow-y-auto">
                <div id="post-as-page-group" class="hidden bg-blue-50/70 border border-blue-200/80 rounded-2xl p-3.5">
                    <label for="post-as-page-select" class="block text-[11px] font-bold uppercase tracking-wider text-accord-slate mb-1.5">
                        <i class="fa-solid fa-user-shield text-accord-blue mr-1"></i> Post As
                    </label>
                    <select id="post-as-page-select" onchange="togglePostTypeFields()" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold focus:outline-none focus:border-accord-blue"></select>
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-accord-slate mb-1.5">Post Type *</label>
                    <select id="post-type" required onchange="togglePostTypeFields()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs font-semibold focus:outline-none focus:border-accord-blue">
                        <option value="testimony">Testimony (Open to All & Anonymous)</option>
                        <option value="video">Video (Ministry / Minister)</option>
                        <option value="audio">Audio (Ministry / Minister)</option>
                        <option value="text">Text Post (Ministry / Minister)</option>
                    </select>
                </div>

                <!-- Author / Anonymous Controls for Testimonies -->
                <div id="testimony-identity-box" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
                    <label class="inline-flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="post-anonymous" onchange="toggleAnonymousAuthorInput()" class="rounded text-accord-blue focus:ring-accord-blue w-4 h-4">
                        <span class="text-xs font-bold text-accord-slate">Post anonymously</span>
                    </label>
                    <div id="guest-author-name-wrapper">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-accord-slate mb-1">Display Name (Optional for Testimonies)</label>
                        <input type="text" id="post-author-name" placeholder="e.g., Grace Mensah or leave blank for Anonymous" class="w-full bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-accord-blue">
                    </div>
                </div>

                <div id="post-url-group" class="hidden">
                    <label id="post-url-label" class="block text-[11px] font-bold uppercase tracking-wider text-accord-slate mb-1.5">Media URL *</label>
                    <input type="url" id="post-url" placeholder="https://www.youtube.com/watch?v=... or audio stream link" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-accord-blue">
                </div>

                <div id="post-content-group">
                    <label id="post-content-label" class="block text-[11px] font-bold uppercase tracking-wider text-accord-slate mb-1.5">Message / Story *</label>
                    <textarea id="post-content" rows="5" required placeholder="Write your testimony, reflection, or text post..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-xs focus:outline-none focus:border-accord-blue"></textarea>
                </div>

                <div id="create-post-error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-xs font-semibold flex items-start gap-2.5">
                    <i class="fa-solid fa-circle-exclamation text-red-500 mt-0.5 shrink-0"></i>
                    <span id="create-post-error-text"></span>
                </div>

                <div class="pt-3 border-t border-slate-200 flex items-center justify-end space-x-3">
                    <button type="button" onclick="closeCreatePostModal()" class="px-5 py-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-accord-slate text-xs font-bold">Cancel</button>
                    <button type="submit" id="create-post-submit-btn" class="px-6 py-3 rounded-xl bg-accord-blue hover:bg-accord-darkBlue text-white text-xs font-bold shadow-md">
                        Publish to Feed
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Content (Facebook-Style Centered Feed) -->
    <main class="flex-grow max-w-2xl mx-auto px-2 sm:px-4 py-4 sm:py-6 w-full space-y-4">
        <div id="accord-ad-banner-slot" class="hidden"></div>

        <!-- Facebook-Style Create Post Card -->
        <div class="bg-white border border-slate-200/80 rounded-xl sm:rounded-2xl p-3.5 sm:p-4 shadow-sm space-y-3">
            <div class="flex items-center gap-2.5 sm:gap-3">
                <div class="w-10 h-10 rounded-full bg-accord-lightBlue text-accord-blue font-bold text-sm flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-user"></i>
                </div>
                <button type="button" onclick="openCreatePostModal('testimony')" class="flex-1 text-left bg-[#F0F2F5] hover:bg-slate-200/80 text-slate-500 text-xs sm:text-sm px-4 py-2.5 rounded-full transition-colors truncate">
                    Share a testimony, sermon, or thought...
                </button>
            </div>
            <div class="border-t border-slate-100 pt-2.5 grid grid-cols-3 gap-1">
                <button type="button" onclick="openCreatePostModal('testimony')" class="py-2 rounded-lg hover:bg-slate-100 text-slate-600 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-heart text-rose-500 text-sm"></i>
                    <span>Testimony</span>
                </button>
                <button type="button" onclick="openCreatePostModal('video')" class="py-2 rounded-lg hover:bg-slate-100 text-slate-600 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-video text-accord-blue text-sm"></i>
                    <span>Video</span>
                </button>
                <button type="button" onclick="openCreatePostModal('text')" class="py-2 rounded-lg hover:bg-slate-100 text-slate-600 text-xs font-semibold flex items-center justify-center gap-1.5 transition-colors">
                    <i class="fa-solid fa-pen-to-square text-emerald-600 text-sm"></i>
                    <span>Post / Audio</span>
                </button>
            </div>
        </div>

        <!-- Search Bar for People & Posts -->
        <div class="bg-white border border-slate-200/80 rounded-xl sm:rounded-2xl p-3 sm:p-3.5 shadow-sm space-y-2.5">
            <div class="relative flex items-center">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-xs pointer-events-none"></i>
                <input
                    type="text"
                    id="feed-search-input"
                    oninput="handleFeedSearchInput(this.value)"
                    placeholder="Search people, ministries, or posts..."
                    class="w-full bg-[#F0F2F5] focus:bg-white border border-transparent focus:border-accord-blue rounded-full pl-9 pr-9 py-2 text-xs sm:text-sm text-accord-slate placeholder-slate-500 focus:outline-none transition-all"
                />
                <button
                    type="button"
                    id="feed-search-clear"
                    onclick="clearFeedSearch()"
                    class="hidden absolute right-3 w-6 h-6 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 flex items-center justify-center text-[10px]"
                    aria-label="Clear search"
                >
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="feed-search-scope-bar" class="hidden items-center justify-between gap-2 pt-0.5">
                <div class="flex items-center gap-1.5">
                    <button type="button" onclick="setFeedSearchScope('all')" id="search-scope-all" class="feed-scope-btn px-3 py-1 rounded-full text-[11px] font-bold bg-accord-slate text-white">All Results</button>
                    <button type="button" onclick="setFeedSearchScope('people')" id="search-scope-people" class="feed-scope-btn px-3 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-accord-slate hover:bg-slate-200">People</button>
                    <button type="button" onclick="setFeedSearchScope('posts')" id="search-scope-posts" class="feed-scope-btn px-3 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-accord-slate hover:bg-slate-200">Posts</button>
                </div>
                <span id="feed-search-summary" class="text-[11px] text-accord-muted font-medium"></span>
            </div>
        </div>

        <!-- 4 Post Type Filter Tabs (Video, Testimony, Audio, Text Posts) -->
        <div class="flex items-center space-x-2 overflow-x-auto no-scrollbar pb-1">
            <button type="button" onclick="setFeedTab('all')" id="tab-all" class="feed-tab-btn whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition-all bg-accord-blue text-white shadow-sm">All Posts</button>
            <button type="button" onclick="setFeedTab('testimony')" id="tab-testimony" class="feed-tab-btn whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition-all bg-white text-accord-slate hover:bg-slate-100 border border-slate-200"><i class="fa-solid fa-heart mr-1.5 text-rose-500"></i>Testimonies</button>
            <button type="button" onclick="setFeedTab('video')" id="tab-video" class="feed-tab-btn whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition-all bg-white text-accord-slate hover:bg-slate-100 border border-slate-200"><i class="fa-solid fa-video mr-1.5 text-accord-blue"></i>Videos</button>
            <button type="button" onclick="setFeedTab('audio')" id="tab-audio" class="feed-tab-btn whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition-all bg-white text-accord-slate hover:bg-slate-100 border border-slate-200"><i class="fa-solid fa-circle-play mr-1.5 text-accord-gold"></i>Audio</button>
            <button type="button" onclick="setFeedTab('text')" id="tab-text" class="feed-tab-btn whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold transition-all bg-white text-accord-slate hover:bg-slate-100 border border-slate-200"><i class="fa-solid fa-align-left mr-1.5 text-emerald-600"></i>Text Posts</button>
        </div>

        <!-- People Search Results Container -->
        <div id="feed-people-results" class="hidden space-y-2.5"></div>

        <!-- Feed Stream Container -->
        <div id="feed-stream" class="space-y-4"></div>

        <!-- Instagram-Style Suggestions For You -->
        <section id="feed-suggestions-section" class="hidden bg-white border border-slate-200/80 rounded-xl sm:rounded-2xl p-3.5 sm:p-4 shadow-sm space-y-3">
            <div class="flex items-center justify-between gap-2">
                <h2 class="text-xs sm:text-sm font-bold text-accord-slate">Suggestions for you</h2>
                <button type="button" onclick="refreshFeedSuggestions()" class="text-[11px] font-bold text-accord-blue hover:text-accord-darkBlue transition-colors">Refresh</button>
            </div>
            <div id="feed-suggestions-list" class="flex items-stretch gap-3 overflow-x-auto no-scrollbar pb-1"></div>
        </section>

    </main>

    <script src="admin-core.js"></script>
    <script src="feed-shared.js"></script>
    <script src="ads.js"></script>
    <script src="footer.js"></script>
    <script src="feed.js?v=6"></script>
</body>
</html>
