<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Sign Up — Accord Archive</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accord: {
                            blue: '#0077FE',
                            darkBlue: '#005BC4',
                            lightBlue: '#E6F0FF',
                            gold: '#F5A623',
                            slate: '#0F172A',
                            muted: '#64748B',
                            bg: '#F8FAFC'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-accord-bg text-accord-slate antialiased min-h-screen flex flex-col justify-between">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-accord-slate text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
        <i id="toast-icon" class="fa-solid fa-circle-check text-accord-gold text-lg"></i>
        <span id="toast-message" class="font-medium text-sm">Action completed successfully.</span>
    </div>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white border border-slate-200/90 rounded-3xl max-w-md w-full p-8 shadow-xl space-y-6">
            
            <!-- Logo Header -->
            <div class="text-center space-y-2">
                <a href="index.html" class="inline-flex items-center space-x-3 group">
                    <div class="w-11 h-11 bg-accord-blue rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                        <span class="font-bold text-xl tracking-tighter">Ac</span>
                    </div>
                </a>
                <h1 class="text-xl font-bold text-accord-slate">Welcome to Accord Archive</h1>
                <p class="text-xs text-accord-muted">Access your saved collections, feed posts, and community library.</p>
            </div>

            <!-- Google Sign-In Button -->
            <button type="button" onclick="handleGoogleSignIn()" class="w-full py-3 px-4 rounded-xl border border-slate-200 hover:bg-slate-50 text-accord-slate text-xs font-bold transition-all flex items-center justify-center space-x-3 shadow-sm">
                <i class="fa-brands fa-google text-red-500 text-sm"></i>
                <span>Continue with Google</span>
            </button>

            <!-- Divider -->
            <div class="relative flex py-1 items-center">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-[10px] font-bold uppercase tracking-wider">Or with email</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Tab Switcher -->
            <div class="grid grid-cols-2 bg-slate-100 p-1 rounded-2xl">
                <button type="button" onclick="switchAuthTab('signin')" id="tab-signin" class="py-2.5 text-xs font-bold rounded-xl transition-all bg-white text-accord-blue shadow-sm">Sign In</button>
                <button type="button" onclick="switchAuthTab('signup')" id="tab-signup" class="py-2.5 text-xs font-bold rounded-xl transition-all text-accord-slate hover:text-accord-blue">Create Account</button>
            </div>

            <!-- Auth Form -->
            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-accord-slate mb-1.5">Email Address</label>
                    <input type="email" id="auth-email" required placeholder="you@example.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-accord-blue">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-accord-slate mb-1.5">Password</label>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-accord-blue">
                </div>

                <button type="submit" id="auth-submit-btn" class="w-full py-3 rounded-xl bg-accord-blue hover:bg-accord-darkBlue text-white text-xs font-bold shadow-lg shadow-blue-500/20 transition-all">
                    Sign In to Account
                </button>
            </form>

            <div class="text-center pt-2">
                <a href="index.html" class="text-xs font-semibold text-accord-muted hover:text-accord-blue transition-colors">← Return to Digital Library</a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-accord-muted">
        © 2026 Accord Media House. All rights reserved.
    </footer>

    <!-- Auth Logic Script -->
    <script>
        const SUPABASE_URL = 'https://mzblgajftvyyosyrawcx.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_fLbHigqm9QdhyYtip0o02A_wUzuE3vP'; // Replace with your anon key if needed
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUpMode = false;

        function switchAuthTab(mode) {
            isSignUpMode = (mode === 'signup');
            const signinBtn = document.getElementById('tab-signin');
            const signupBtn = document.getElementById('tab-signup');
            const submitBtn = document.getElementById('auth-submit-btn');

            if (isSignUpMode) {
                signupBtn.className = 'py-2.5 text-xs font-bold rounded-xl transition-all bg-white text-accord-blue shadow-sm';
                signinBtn.className = 'py-2.5 text-xs font-bold rounded-xl transition-all text-accord-slate hover:text-accord-blue';
                submitBtn.textContent = 'Create Account';
            } else {
                signinBtn.className = 'py-2.5 text-xs font-bold rounded-xl transition-all bg-white text-accord-blue shadow-sm';
                signupBtn.className = 'py-2.5 text-xs font-bold rounded-xl transition-all text-accord-slate hover:text-accord-blue';
                submitBtn.textContent = 'Sign In to Account';
            }
        }

        async function handleGoogleSignIn() {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });
            if (error) {
                showToast(error.message, true);
            }
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const submitBtn = document.getElementById('auth-submit-btn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Processing...';

            if (isSignUpMode) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    showToast(error.message, true);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                    return;
                }
                showToast('Account created successfully! You can now sign in.');
                switchAuthTab('signin');
                submitBtn.disabled = false;
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    showToast(error.message, true);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In to Account';
                    return;
                }
                showToast('Signed in successfully! Redirecting...');
                setTimeout(() => window.location.href = 'index.html', 1200);
            }
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');
            
            if (!toast) return;
            msgEl.textContent = message;
            iconEl.className = isError ? 'fa-solid fa-circle-exclamation text-red-500 text-lg' : 'fa-solid fa-circle-check text-accord-gold text-lg';

            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3500);
        }
    </script>
</body>
</html>
