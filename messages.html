<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages — Accord Archive</title>
    <link rel="icon" type="image/svg+xml" href="assets/accord-mark.svg" />
    <meta name="description" content="Direct messages and fellowship group chats on Accord Archive." />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accord: {
                            blue: '#0077FE',
                            darkBlue: '#005BC4',
                            lightBlue: '#E6F0FF',
                            gold: '#F5A623',
                            goldLight: '#FEF9E7',
                            slate: '#0F172A',
                            muted: '#64748B',
                            bg: '#F8FAFC'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif-heading { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-accord-bg text-accord-slate antialiased min-h-screen flex flex-col">

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-accord-slate text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
        <i id="toast-icon" class="fa-solid fa-circle-check text-accord-gold text-base"></i>
        <span id="toast-message" class="font-medium text-sm">Action completed.</span>
    </div>

    <!-- Global Header -->
    <div id="accord-header"></div>
    <script src="header.js?v=5"></script>

    <!-- New DM Modal -->
    <div id="new-dm-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-accord-slate text-base">New Direct Message</h3>
                <button type="button" onclick="closeNewDmModal()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="p-4 border-b border-slate-100">
                <input type="text" id="new-dm-search" oninput="renderNewDmUsers()" placeholder="Search people by name..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-accord-blue">
            </div>
            <div id="new-dm-users-list" class="p-3 overflow-y-auto space-y-1 max-h-80"></div>
        </div>
    </div>

    <!-- New Group Modal -->
    <div id="new-group-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-accord-slate text-base">Create Group Chat</h3>
                <button type="button" onclick="closeNewGroupModal()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form onsubmit="handleCreateGroupSubmit(event)" class="p-5 space-y-4 flex flex-col overflow-hidden">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Group Name</label>
                    <input type="text" id="new-group-title" required placeholder="e.g., Bible Study Fellowship" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-accord-blue">
                </div>
                <div class="space-y-2 flex-1 overflow-hidden flex flex-col">
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate">Select Members</label>
                    <input type="text" id="new-group-search" oninput="renderNewGroupMembers()" placeholder="Filter members..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-accord-blue">
                    <div id="new-group-members-list" class="overflow-y-auto space-y-1 max-h-52 border border-slate-100 rounded-xl p-2"></div>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-accord-blue hover:bg-accord-darkBlue text-white text-xs font-bold shadow-md">Create Group</button>
            </form>
        </div>
    </div>

    <!-- Attach Book / Post Modal -->
    <div id="attach-item-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="font-bold text-accord-slate text-base">Share Book or Post</h3>
                <button type="button" onclick="closeAttachModal()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="px-4 pt-3 flex items-center gap-2">
                <button type="button" id="attach-tab-books" onclick="setAttachTab('books')" class="px-4 py-2 rounded-xl text-xs font-bold bg-accord-blue text-white">Books</button>
                <button type="button" id="attach-tab-posts" onclick="setAttachTab('posts')" class="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-accord-slate">Feed Posts</button>
            </div>
            <div class="p-4 border-b border-slate-100">
                <input type="text" id="attach-search" oninput="renderAttachItems()" placeholder="Search by title or author..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-accord-blue">
            </div>
            <div id="attach-items-list" class="p-3 overflow-y-auto space-y-1.5 max-h-80"></div>
        </div>
    </div>

    <!-- Main Chat Workspace -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-2 sm:px-6 py-2 sm:py-5">
        <div class="bg-white border border-slate-200 rounded-2xl sm:rounded-3xl shadow-sm overflow-hidden grid grid-cols-1 md:grid-cols-[320px_1fr] h-[calc(100dvh-88px)] md:h-[calc(100vh-135px)] min-h-[420px]">

            <!-- Left: Conversation List -->
            <aside id="chat-sidebar" class="border-r border-slate-200 flex flex-col bg-slate-50/40 min-h-0">
                <div class="p-4 border-b border-slate-200 bg-white space-y-3">
                    <div class="flex items-center justify-between">
                        <h1 class="serif-heading text-xl font-bold text-accord-slate">Messages</h1>
                        <div class="flex items-center gap-1.5">
                            <button type="button" onclick="openNewDmModal()" class="w-9 h-9 rounded-xl bg-accord-lightBlue hover:bg-blue-100 text-accord-blue flex items-center justify-center transition-colors" title="New Direct Message">
                                <i class="fa-regular fa-pen-to-square text-sm"></i>
                            </button>
                            <button type="button" onclick="openNewGroupModal()" class="w-9 h-9 rounded-xl bg-amber-50 hover:bg-amber-100 text-accord-gold flex items-center justify-center transition-colors" title="New Group Chat">
                                <i class="fa-solid fa-users text-sm"></i>
                            </button>
                        </div>
                    </div>
                    <input type="text" id="conv-search" oninput="renderConversationsList()" placeholder="Search chats..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none focus:border-accord-blue">
                </div>

                <div id="conversations-list" class="flex-1 overflow-y-auto divide-y divide-slate-100">
                    <p class="p-6 text-center text-xs text-accord-muted">Loading conversations...</p>
                </div>
            </aside>

            <!-- Right: Active Chat Thread -->
            <section id="chat-thread-pane" class="hidden md:flex flex-col bg-white min-h-0">
                <!-- Empty Selection State -->
                <div id="chat-empty-state" class="flex-1 flex flex-col items-center justify-center p-8 text-center space-y-3">
                    <div class="w-16 h-16 rounded-2xl bg-accord-lightBlue text-accord-blue flex items-center justify-center text-2xl">
                        <i class="fa-regular fa-paper-plane"></i>
                    </div>
                    <h2 class="serif-heading text-xl font-bold text-accord-slate">Your Fellowship Inbox</h2>
                    <p class="text-xs text-accord-muted max-w-sm">Message brothers and sisters directly, create group chats, and share books, posts, and testimonies.</p>
                    <div class="flex items-center gap-2 pt-2">
                        <button type="button" onclick="openNewDmModal()" class="px-4 py-2.5 rounded-xl bg-accord-blue hover:bg-accord-darkBlue text-white text-xs font-bold">New Message</button>
                        <button type="button" onclick="openNewGroupModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-accord-slate text-xs font-bold">New Group</button>
                    </div>
                </div>

                <!-- Active Thread Container -->
                <div id="chat-active-container" class="hidden flex-1 flex flex-col min-h-0">
                    <!-- Thread Header -->
                    <div class="px-4 sm:px-6 py-3.5 border-b border-slate-200 flex items-center justify-between bg-white shrink-0">
                        <div class="flex items-center space-x-3 min-w-0">
                            <button type="button" onclick="closeMobileThread()" class="md:hidden w-8 h-8 rounded-full bg-slate-100 text-accord-slate flex items-center justify-center">
                                <i class="fa-solid fa-arrow-left text-xs"></i>
                            </button>
                            <div id="active-chat-avatar" class="w-10 h-10 rounded-full bg-accord-lightBlue text-accord-blue font-bold text-sm flex items-center justify-center shrink-0">U</div>
                            <div class="min-w-0">
                                <a id="active-chat-title" href="#" class="text-sm font-bold text-accord-slate hover:text-accord-blue truncate block">Conversation</a>
                                <p id="active-chat-subtitle" class="text-[11px] text-accord-muted truncate"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Messages Stream -->
                    <div id="messages-stream" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3 bg-slate-50/60">
                        <!-- Messages rendered here -->
                    </div>

                    <!-- Reply Preview Bar -->
                    <div id="chat-reply-preview" class="hidden px-3 sm:px-4 py-2 border-t border-slate-200 bg-slate-50 flex items-center justify-between gap-3 shrink-0">
                        <div class="border-l-4 border-accord-blue pl-2.5 min-w-0 flex-1">
                            <p id="chat-reply-author" class="text-[11px] font-bold text-accord-blue truncate">Replying to</p>
                            <p id="chat-reply-text" class="text-xs text-accord-muted truncate"></p>
                        </div>
                        <button type="button" onclick="cancelReplyMessage()" class="w-7 h-7 rounded-full hover:bg-slate-200 text-slate-500 flex items-center justify-center shrink-0" aria-label="Cancel reply">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>

                    <!-- Message Composer -->
                    <form onsubmit="handleSendMessage(event)" class="p-2.5 sm:p-4 border-t border-slate-200 bg-white flex items-center gap-2 shrink-0">
                        <button type="button" onclick="openAttachModal()" class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-accord-lightBlue text-accord-slate hover:text-accord-blue flex items-center justify-center shrink-0 transition-colors" title="Share Book or Post">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                        <input type="text" id="chat-message-input" placeholder="Write a message..." autocomplete="off" class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-accord-blue focus:bg-white">
                        <button type="submit" id="chat-send-btn" class="px-5 py-2.5 rounded-xl bg-accord-blue hover:bg-accord-darkBlue text-white text-xs font-bold shadow-sm shrink-0 transition-colors">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <script src="messages.js?v=1"></script>
</body>
</html>
