<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimony Detail — Accord Archive & Library</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accord: {
                            blue: '#0077FF', darkBlue: '#005BC4', lightBlue: '#E6F0FF',
                            gold: '#F5A623', goldLight: '#FEF9E7', slate: '#0F172A',
                            muted: '#64748B', bg: '#F8FAFC'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .serif-heading { font-family: 'Playfair Display', serif; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-accord-bg text-accord-slate antialiased min-h-screen flex flex-col justify-between">

    <!-- Global Header Container -->
    <div id="accord-header"></div>
    <script src="header.js?v=4"></script>

    <main id="testimony-detail-container" class="max-w-3xl mx-auto px-4 sm:px-6 py-12 flex-grow w-full">
        <div class="text-center py-16">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-accord-blue mb-3"></i>
            <p class="text-sm text-accord-muted">Loading testimony...</p>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 text-center text-xs text-[#64748B]">
        © 2026 Accord Media House. All rights reserved.
    </footer>
    <script src="testimony-detail.js?v=2"></script>
</body>
</html>
