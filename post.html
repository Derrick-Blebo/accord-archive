<body class="bg-accord-bg text-accord-slate antialiased min-h-screen flex flex-col justify-between">

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-[200] pointer-events-none transform translate-y-24 opacity-0 transition-all duration-300 bg-accord-slate text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
        <i id="toast-icon" class="fa-solid fa-circle-check text-accord-gold text-lg"></i>
        <span id="toast-message" class="font-medium text-sm">Action completed.</span>
    </div>

    <!-- Global Header Container -->
    <div id="accord-header"></div>
    <script src="header.js?v=6"></script>

    <!-- Report / Flag Modal -->
    <div id="report-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-accord-slate text-base">Flag / Report Post</h3>
                <button type="button" onclick="closeReportModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form onsubmit="handleReportSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Reason</label>
                    <select id="report-category-reason" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs">
                        <option value="Spam or Promotional">Spam or Promotional</option>
                        <option value="Off-Topic or Misleading">Off-Topic or Misleading</option>
                        <option value="Inappropriate Content">Inappropriate Content</option>
                        <option value="Harassment or Harm">Harassment or Harm</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Details</label>
                    <textarea id="report-reason" rows="3" required placeholder="Describe why this post should be flagged..." class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeReportModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-xs font-bold">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold">Flag Post</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Repost Modal -->
    <div id="repost-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4" onclick="closeRepostModal()">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-accord-slate text-base flex items-center space-x-2">
                    <i class="fa-solid fa-retweet text-emerald-600"></i>
                    <span>Repost to Followers</span>
                </h3>
                <button type="button" onclick="closeRepostModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p id="repost-post-preview" class="text-xs text-accord-muted bg-slate-50 border border-slate-100 rounded-xl p-3 line-clamp-2"></p>
            <form id="repost-form" onsubmit="handleRepostSubmit(event)" class="space-y-4">
                <input type="hidden" id="repost-post-id">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-accord-slate mb-1.5">Add a Thought (Optional)</label>
                    <textarea id="repost-quote-text" rows="3" placeholder="Why are you sharing this post?" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs focus:outline-none focus:border-accord-blue"></textarea>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeRepostModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-xs font-bold">Cancel</button>
                    <button type="submit" id="repost-submit-btn" class="px-5 py-2.5 rounded-xl bg-accord-blue hover:bg-accord-darkBlue text-white text-xs font-bold">Repost Now</button>
                </div>
            </form>
        </div>
    </div>

    <main class="flex-grow max-w-2xl mx-auto px-4 sm:px-6 py-8 w-full space-y-5">
        <div>
            <a href="feed.html" class="inline-flex items-center space-x-2 text-xs font-bold text-accord-muted hover:text-accord-blue">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Fellowship Feed</span>
            </a>
        </div>

        <!-- Facebook-Style Single Post Container -->
        <div id="single-post-container" class="space-y-4">
            <div class="bg-white border border-slate-200/80 rounded-2xl p-10 text-center text-xs text-accord-muted shadow-sm">
                <i class="fa-solid fa-spinner fa-spin text-xl text-accord-blue mb-2"></i>
                <p>Loading post...</p>
            </div>
        </div>

    <script src="admin-core.js"></script>
    <script src="audio-embed-shared.js"></script>
    <script src="feed-shared.js?v=5"></script>
    <script src="footer.js?v=2"></script>
    <script>
        let currentPost = null;
        let currentUser = null;
        let currentProfile = null;
        let isLiked = false;
        let isReposted = false;
        let authorHandle = '';
        let commentsList = [];

        function getVoterKey() {
            if (currentUser?.id) return `user_${currentUser.id}`;
            let guestKey = localStorage.getItem('accord_guest_voter_key');
            if (!guestKey) {
                guestKey = 'guest_' + (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}_${Math.random().toString(36).slice(2)}`);
                localStorage.setItem('accord_guest_voter_key', guestKey);
            }
            return guestKey;
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');
            if (!toast) return;
            msgEl.textContent = message;
            iconEl.className = isError
                ? 'fa-solid fa-circle-exclamation text-red-500 text-lg'
                : 'fa-solid fa-circle-check text-accord-gold text-lg';
            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getYouTubeEmbedUrl(url) {
            let videoId = '';
            if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1]?.split('?')[0];
            else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1]?.split('&')[0];
            else if (url.includes('embed/')) videoId = url.split('embed/')[1]?.split('?')[0];
            return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            let postId = params.get('id');
            const legacyTestimonyId = params.get('legacy_testimony');

            if (!postId && legacyTestimonyId) {
                const { data: legacyPost } = await supabaseClient
                    .from('feed_posts')
                    .select('id')
                    .eq('legacy_testimony_id', Number(legacyTestimonyId))
                    .maybeSingle();
                if (legacyPost?.id) postId = legacyPost.id;
            }

            if (!postId) {
                document.getElementById('single-post-container').innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-8 text-xs text-accord-muted text-center">No post ID specified.</div>`;
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            currentUser = session?.user || null;
            if (currentUser) {
                const { data: prof } = await supabaseClient
                    .from('profiles')
                    .select('id, full_name, handle, email, account_type')
                    .eq('id', currentUser.id)
                    .maybeSingle();
                currentProfile = prof || {
                    id: currentUser.id,
                    full_name: currentUser.user_metadata?.full_name || currentUser.email.split('@')[0],
                    account_type: 'normal_user'
                };
            }

            await loadPostAndComments(postId);
        });

        async function loadPostAndComments(postId) {
            const requests = [
                supabaseClient.from('feed_posts').select('*').eq('id', postId).maybeSingle(),
                supabaseClient.from('post_likes').select('id').eq('post_id', postId).eq('voter_key', getVoterKey()).maybeSingle(),
                supabaseClient.from('post_comments').select('*').eq('post_id', postId).order('created_at', { ascending: true })
            ];
            if (currentUser?.id) {
                requests.push(
                    supabaseClient.from('post_reposts').select('id').eq('post_id', postId).eq('user_id', currentUser.id).maybeSingle()
                );
            }

            const [postRes, likeRes, commentsRes, repostRes] = await Promise.all(requests);

            if (postRes.error || !postRes.data) {
                document.getElementById('single-post-container').innerHTML = `<div class="bg-white border border-slate-200 rounded-2xl p-8 text-xs text-red-600 text-center">Post not found.</div>`;
                return;
            }

            currentPost = postRes.data;
            isLiked = Boolean(likeRes.data);
            isReposted = Boolean(repostRes?.data);
            commentsList = commentsRes.data || [];
            authorHandle = '';
            authorAvatarUrl = '';

            if (currentPost.author_id && !currentPost.is_anonymous) {
                const { data: ap } = await supabaseClient
                    .from('profiles')
                    .select('handle, avatar_url')
                    .eq('id', currentPost.author_id)
                    .maybeSingle();
                authorHandle = ap?.handle || '';
                authorAvatarUrl = ap?.avatar_url || '';
            }

            const docSnippet = (currentPost.body || '').trim();
            document.title = docSnippet
                ? `${docSnippet.slice(0, 60)}${docSnippet.length > 60 ? '...' : ''} — Accord Fellowship Feed`
                : 'Post — Accord Fellowship Feed';

            if (currentUser?.id) {
                supabaseClient
                    .from('post_views')
                    .upsert({ user_id: currentUser.id, post_id: currentPost.id, viewed_at: new Date().toISOString() }, { onConflict: 'user_id,post_id' })
                    .then(() => {});
            }

            window.editableFeedPageIds = [];
            if (currentUser?.id && currentPost.author_id && String(currentUser.id) !== String(currentPost.author_id)) {
                try {
                    const { data: adminRows } = await supabaseClient
                        .from('page_admins')
                        .select('page_id, role, permissions, profiles!page_admins_page_id_fkey(id, account_type, upgrade_status)')
                        .eq('admin_user_id', currentUser.id)
                        .eq('page_id', currentPost.author_id);
                    window.editableFeedPageIds = (adminRows || [])
                        .filter(r => {
                            const prof = r.profiles;
                            const isVerified = prof && (prof.account_type === 'ministry_minister' || prof.upgrade_status === 'approved') && prof.upgrade_status !== 'revoked';
                            const p = r.permissions;
                            const canEdit = p && typeof p === 'object' ? Boolean(p.can_edit_delete_posts) : (r.role === 'admin');
                            return isVerified && canEdit;
                        })
                        .map(r => String(r.page_id));
                } catch {
                    window.editableFeedPageIds = [];
                }
            }

            renderSinglePost();
        }

        function renderSinglePost() {
            const container = document.getElementById('single-post-container');
            if (!container || !currentPost) return;

            const myAvatarInitial = (currentProfile?.full_name || currentUser?.email || 'U').charAt(0).toUpperCase();
            const card = createSharedFeedCardElement(currentPost, {
                isLiked,
                isReposted,
                commentsCount: commentsList.length,
                myAvatarInitial,
                authorHandle,
                authorAvatarUrl,
                currentUserId: currentUser?.id || null,
                expandFullBody: true,
                openCommentsByDefault: true,
                showOpenFullPostLink: false
            });

            container.innerHTML = '';
            container.appendChild(card);

            const listEl = document.getElementById(`inline-comments-list-${currentPost.id}`);
            if (listEl) {
                listEl.innerHTML = renderSharedCommentsHtml(commentsList);
            }
            hydrateSharedBookLinkPreviews(container);
        }

        function closeAllFeedPostMenus() {
            document.querySelectorAll('.feed-post-menu').forEach(el => el.classList.add('hidden'));
        }

        function toggleFeedPostMenu(e, postId) {
            e.stopPropagation();
            const menu = document.getElementById(`feed-post-menu-${postId}`);
            if (!menu) return;
            const isHidden = menu.classList.contains('hidden');
            closeAllFeedPostMenus();
            if (isHidden) menu.classList.remove('hidden');
        }

        window.addEventListener('click', closeAllFeedPostMenus);

        function toggleInlineComments(postId) {
            const container = document.getElementById(`inline-comments-${postId}`);
            if (!container) return;
            container.classList.remove('hidden');
            document.getElementById(`inline-comment-input-${postId}`)?.focus();
        }

        function handleShareClick() {
            if (!currentPost) return;
            shareOrCopyPost(currentPost);
        }

        function handleSendPostToChat() {
            if (!currentPost || typeof openShareToChatModal !== 'function') return;
            const videoThumb = currentPost.post_type === 'video' && typeof getSharedVideoThumbnailUrl === 'function'
                ? getSharedVideoThumbnailUrl(currentPost.media_url)
                : '';
            openShareToChatModal({
                type: currentPost.post_type === 'testimony' ? 'shared_testimony' : 'shared_post',
                id: currentPost.id,
                title: (currentPost.body || '').slice(0, 70) || 'Fellowship Post',
                subtitle: (currentPost.body || '').slice(0, 110),
                url: getPostShareUrl(currentPost.id),
                image_url: videoThumb,
                media_url: currentPost.media_url || '',
                author_name: currentPost.is_anonymous ? 'Anonymous' : (currentPost.author_name || 'Member'),
                post_type: currentPost.post_type
            });
        }

        function handleEditPostClick() {
            if (!currentPost || typeof openSharedEditPostModal !== 'function') return;
            openSharedEditPostModal(currentPost, (updated) => {
                if (updated) {
                    currentPost = updated;
                    renderSinglePost();
                }
            });
        }

        function handleDeletePostClick() {
            if (!currentPost || typeof executeSharedDeletePost !== 'function') return;
            executeSharedDeletePost(currentPost.id, () => {
                setTimeout(() => { window.location.href = 'feed.html'; }, 600);
            });
        }

        async function togglePostLike() {
            if (!currentPost) return;
            const voterKey = getVoterKey();
            let nextCount = Number(currentPost.likes_count) || 0;

            if (isLiked) {
                await supabaseClient.from('post_likes').delete().eq('post_id', currentPost.id).eq('voter_key', voterKey);
                isLiked = false;
                nextCount = Math.max(0, nextCount - 1);
            } else {
                const { error } = await supabaseClient.from('post_likes').insert([{ post_id: currentPost.id, voter_key: voterKey }]);
                if (error) {
                    showToast('Could not record like.', true);
                    return;
                }
                isLiked = true;
                nextCount += 1;
            }

            currentPost.likes_count = nextCount;
            await supabaseClient.from('feed_posts').update({ likes_count: nextCount }).eq('id', currentPost.id);

            const countEl = document.getElementById(`like-count-${currentPost.id}`);
            const btnEl = document.getElementById(`like-btn-${currentPost.id}`);
            if (countEl) countEl.textContent = nextCount;
            if (btnEl) {
                btnEl.className = isLiked
                    ? 'py-2 rounded-lg hover:bg-slate-100 flex items-center justify-center gap-1.5 text-xs sm:text-[13px] font-semibold transition-colors text-rose-600'
                    : 'py-2 rounded-lg hover:bg-slate-100 flex items-center justify-center gap-1.5 text-xs sm:text-[13px] font-semibold transition-colors text-slate-600';
                const icon = btnEl.querySelector('i');
                if (icon) icon.className = isLiked ? 'fa-solid fa-heart text-sm' : 'fa-regular fa-heart text-sm';
            }
        }

        async function handleRepostClick(postId) {
            if (!currentUser) {
                showToast('Please sign in to repost to your followers.', true);
                setTimeout(() => { window.location.href = `signin.html?next=${encodeURIComponent('post.html?id=' + postId)}`; }, 800);
                return;
            }
            if (isReposted) {
                const { error } = await supabaseClient
                    .from('post_reposts')
                    .delete()
                    .eq('post_id', postId)
                    .eq('user_id', currentUser.id);
                if (error) {
                    showToast(`Could not remove repost: ${error.message}`, true);
                    return;
                }
                showToast('Repost removed.');
                await loadPostAndComments(postId);
                return;
            }
            document.getElementById('repost-post-id').value = postId;
            const previewEl = document.getElementById('repost-post-preview');
            if (previewEl && currentPost) {
                const snippet = (currentPost.body || '').trim();
                const shortSnippet = snippet.length > 80 ? `${snippet.slice(0, 80)}...` : snippet;
                previewEl.textContent = `${shortSnippet || 'Post'} — ${currentPost.author_name || 'Member'}`;
            }
            const modal = document.getElementById('repost-modal');
            modal?.classList.remove('hidden');
            modal?.classList.add('flex');
        }

        function closeRepostModal() {
            const modal = document.getElementById('repost-modal');
            modal?.classList.add('hidden');
            modal?.classList.remove('flex');
            document.getElementById('repost-form')?.reset();
        }

        async function handleRepostSubmit(e) {
            e.preventDefault();
            if (!currentUser || !currentPost) return;
            const quoteText = document.getElementById('repost-quote-text')?.value.trim() || null;
            const btn = document.getElementById('repost-submit-btn');
            if (btn) btn.disabled = true;
            const { error } = await supabaseClient
                .from('post_reposts')
                .insert([{ post_id: currentPost.id, user_id: currentUser.id, quote_text: quoteText }]);
            if (btn) btn.disabled = false;
            if (error) {
                showToast(`Could not repost: ${error.message}`, true);
                return;
            }
            closeRepostModal();
            showToast('Reposted to your followers!');
            await loadPostAndComments(currentPost.id);
        }

        async function submitInlineComment(e, postId) {
            e.preventDefault();
            if (!currentUser) {
                showToast('Please sign in to comment on posts.', true);
                setTimeout(() => { window.location.href = `signin.html?next=${encodeURIComponent('post.html?id=' + postId)}`; }, 800);
                return;
            }
            if (!currentPost) return;

            const inputEl = document.getElementById(`inline-comment-input-${postId}`);
            const text = inputEl?.value.trim() || '';
            if (!text) return;

            const activeCtx = typeof window.getAccordActiveContext === 'function' ? window.getAccordActiveContext() : null;
            if (activeCtx?.isSwitched && !activeCtx.permissions?.can_post) {
                showToast('You do not have permission to comment on behalf of this verified page.', true);
                return;
            }
            const commentAuthorId = activeCtx?.isSwitched ? activeCtx.activeProfileId : currentUser.id;
            const authorName = activeCtx?.isSwitched
                ? (activeCtx.activeProfile?.full_name || 'Verified Page')
                : (currentProfile?.full_name || currentUser.email.split('@')[0]);
            inputEl.value = '';

            const { error } = await supabaseClient.from('post_comments').insert([{
                post_id: currentPost.id,
                user_id: currentUser.id,
                author_id: commentAuthorId,
                author_name: authorName,
                comment_text: text
            }]);

            if (error) {
                showToast(`Could not post comment: ${error.message}`, true);
                inputEl.value = text;
                return;
            }

            showToast('Comment posted.');
            await loadPostAndComments(currentPost.id);
        }

        function openReportModal() {
            const modal = document.getElementById('report-modal');
            modal?.classList.remove('hidden');
            modal?.classList.add('flex');
        }

        function closeReportModal() {
            const modal = document.getElementById('report-modal');
            modal?.classList.remove('flex');
            modal?.classList.add('hidden');
        }

        async function handleReportSubmit(e) {
            e.preventDefault();
            if (!currentPost) return;
            const reason = document.getElementById('report-category-reason').value;
            const details = document.getElementById('report-reason').value.trim();

            const { error } = await supabaseClient.from('post_reports').insert([{
                post_id: currentPost.id,
                reporter_id: currentUser ? currentUser.id : null,
                reason,
                details
            }]);

            if (error) {
                showToast('Could not submit flag.', true);
                return;
            }

            closeReportModal();
            showToast('Post flagged for review.');
        }
    </script>
    <script src="ads.js"></script>
</body>
</html>
