<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Profile — Accord Archive</title>
    <meta name="description" content="Explore community profiles, verified ministries, posts, reposts, and activities on Accord Archive." />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accord: {
                            blue: '#0077FE',
                            darkBlue: '#005BC4',
                            lightBlue: '#E6F0FF',
                            gold: '#F5A623',
                            goldLight: '#FEF9E7',
                            slate: '#0F172A',
                            muted: '#64748B',
                            bg: '#F8FAFC'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
        .serif-heading { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-accord-bg text-accord-slate min-h-screen flex flex-col justify-between">

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 bg-accord-slate text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700">
        <i id="toast-icon" class="fa-solid fa-circle-check text-accord-gold text-base"></i>
        <span id="toast-message" class="font-medium text-sm">Action completed.</span>
    </div>

    <!-- Global Header -->
    <div id="accord-header"></div>
    <script src="header.js?v=5"></script>

    <!-- Followers / Following Modal -->
    <div id="connections-modal" class="fixed inset-0 z-50 bg-accord-slate/70 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full shadow-2xl overflow-hidden flex flex-col max-h-[80vh]">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 id="connections-modal-title" class="font-bold text-accord-slate text-base">Connections</h3>
                <button type="button" onclick="closeConnectionsModal()" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="connections-modal-list" class="p-4 overflow-y-auto divide-y divide-slate-100 space-y-1">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

    <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <div>
            <a href="feed.html" class="inline-flex items-center space-x-2 text-xs font-bold text-accord-muted hover:text-accord-blue transition-colors">
                <i class="fa-solid fa-arrow-left text-[11px]"></i>
                <span>Back to Fellowship Feed</span>
            </a>
        </div>

        <!-- Loading -->
        <div id="profile-loading" class="bg-white border border-slate-200/90 rounded-3xl p-8 shadow-sm animate-pulse space-y-4">
            <div class="flex items-center gap-4">
                <div class="w-20 h-20 rounded-full bg-slate-200 shrink-0"></div>
                <div class="space-y-2.5 flex-1">
                    <div class="h-6 w-52 bg-slate-200 rounded-lg"></div>
                    <div class="h-4 w-36 bg-slate-100 rounded-lg"></div>
                </div>
            </div>
        </div>

        <!-- Not Found -->
        <div id="profile-not-found" class="hidden bg-white border border-slate-200/90 rounded-3xl p-12 text-center space-y-4 shadow-sm">
            <div class="w-16 h-16 rounded-2xl bg-slate-100 text-slate-400 flex items-center justify-center mx-auto text-2xl">
                <i class="fa-regular fa-user"></i>
            </div>
            <h1 class="serif-heading text-2xl font-bold text-accord-slate">Account Not Found</h1>
            <p class="text-sm text-accord-muted max-w-md mx-auto">This profile may not exist or is no longer available.</p>
            <a href="feed.html" class="inline-flex items-center space-x-2 px-5 py-2.5 rounded-xl bg-accord-blue hover:bg-accord-darkBlue text-white text-xs font-bold">
                <span>Return to Feed</span>
            </a>
        </div>

        <!-- Profile Header Card -->
        <section id="profile-header-card" class="hidden bg-white border border-slate-200/90 rounded-3xl overflow-hidden shadow-sm">
            <div class="h-28 sm:h-36 bg-gradient-to-r from-accord-blue via-blue-600 to-accord-slate relative">
                <div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_top_right,_#F5A623,_transparent_60%)]"></div>
            </div>
            <div class="px-6 sm:px-8 pb-7">
                <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 -mt-10 sm:-mt-12 relative z-10">
                    <div class="flex items-end gap-4">
                        <div class="relative w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-accord-blue text-white font-extrabold text-2xl sm:text-3xl flex items-center justify-center ring-4 ring-white shadow-lg shrink-0 overflow-hidden">
                            <span id="profile-avatar-initial">U</span>
                            <span id="profile-verified-icon" class="hidden absolute bottom-0 right-0 w-7 h-7 z-10"></span>
                        </div>
                        <div class="pb-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <h1 id="profile-display-name" class="serif-heading text-2xl sm:text-3xl font-bold text-accord-slate">User</h1>
                                <span id="profile-role-badge" class="hidden px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-accord-gold border border-amber-200">
                                    <i class="fa-solid fa-circle-check mr-1"></i>Verified Ministry
                                </span>
                            </div>
                            <p id="profile-joined-date" class="text-xs text-accord-muted mt-0.5"></p>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-wrap items-center gap-2">
                        <button type="button" id="user-follow-btn" onclick="toggleFollowUser()" class="hidden px-5 py-2.5 rounded-xl bg-accord-blue hover:bg-accord-darkBlue text-white text-xs font-bold shadow-sm transition-all inline-flex items-center space-x-2">
                            <i id="user-follow-icon" class="fa-solid fa-user-plus"></i>
                            <span id="user-follow-label">Follow</span>
                        </button>
                        <button type="button" id="user-message-btn" onclick="startDmWithUser()" class="hidden px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-accord-slate text-xs font-bold transition-all inline-flex items-center space-x-2">
                            <i class="fa-regular fa-paper-plane"></i>
                            <span>Message</span>
                        </button>
                        <a id="user-edit-btn" href="profile.html" class="hidden px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-accord-slate text-xs font-bold transition-all inline-flex items-center space-x-2">
                            <i class="fa-regular fa-pen-to-square"></i>
                            <span>Edit Profile</span>
                        </a>
                        <button type="button" onclick="shareUserProfile()" class="px-4 py-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 text-accord-slate text-xs font-bold transition-all inline-flex items-center space-x-1.5" title="Share Profile">
                            <i class="fa-solid fa-share-nodes"></i>
                            <span>Share</span>
                        </button>
                    </div>
                </div>

                <p id="profile-bio" class="hidden text-sm text-slate-700 mt-4 leading-relaxed"></p>

                <!-- Stats Bar -->
                <div class="mt-6 pt-5 border-t border-slate-100 flex flex-wrap items-center gap-6 sm:gap-10">
                    <button type="button" onclick="openConnectionsModal('followers')" class="text-left group">
                        <span id="stat-followers" class="text-lg font-extrabold text-accord-slate group-hover:text-accord-blue transition-colors">0</span>
                        <span class="text-xs font-semibold text-accord-muted ml-1">Followers</span>
                    </button>
                    <button type="button" onclick="openConnectionsModal('following')" class="text-left group">
                        <span id="stat-following" class="text-lg font-extrabold text-accord-slate group-hover:text-accord-blue transition-colors">0</span>
                        <span class="text-xs font-semibold text-accord-muted ml-1">Following</span>
                    </button>
                    <div>
                        <span id="stat-posts" class="text-lg font-extrabold text-accord-slate">0</span>
                        <span class="text-xs font-semibold text-accord-muted ml-1">Posts & Reposts</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Profile Tabs -->
        <div id="profile-tabs-bar" class="hidden flex items-center space-x-2 overflow-x-auto pb-1">
            <button type="button" id="ptab-posts" onclick="setProfileTab('posts')" class="ptab-btn px-5 py-2.5 rounded-xl text-xs font-bold bg-accord-blue text-white shadow-sm transition-all">Posts & Reposts</button>
            <button type="button" id="ptab-testimonies" onclick="setProfileTab('testimonies')" class="ptab-btn px-5 py-2.5 rounded-xl text-xs font-bold bg-white text-accord-slate border border-slate-200 hover:bg-slate-100 transition-all">Testimonies</button>
            <button type="button" id="ptab-activities" onclick="setProfileTab('activities')" class="ptab-btn px-5 py-2.5 rounded-xl text-xs font-bold bg-white text-accord-slate border border-slate-200 hover:bg-slate-100 transition-all">Activities</button>
        </div>

        <!-- Tab Content Stream -->
        <section id="profile-stream" class="hidden space-y-4"></section>
    </main>

    <div id="accord-footer"></div>
    <script src="footer.js"></script>
    <script src="feed-shared.js?v=2"></script>
    <script src="user.js?v=1"></script>
</body>
</html>
